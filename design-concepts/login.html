<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Cober360</title>
<meta name="description" content="Concepto de rediseño — ingreso al sistema.">
<link rel="stylesheet" href="assets/cober.css">
<script>
  /* Tema antes del primer pintado: sin esto hay destello. */
  try {
    var t = localStorage.getItem("cober-concept-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* modo privado */ }
</script>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5 14.5 13.5H1.5L8 2.5Z"/><path d="M8 6.5v3M8 11.5h.01"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M15 8h-1.5M2.5 8H1M12.9 3.1l-1 1M4.1 11.9l-1 1M12.9 12.9l-1-1M4.1 4.1l-1-1"/></symbol>
</svg>

<main class="gate">
  <button class="btn btn-quiet btn-icon" data-theme-toggle type="button">
    <svg width="14" height="14" aria-hidden="true"><use href="#i-sun"/></svg>
  </button>

  <div class="gate-panel">
    <img class="gate-logo" src="assets/logo-cober.png" alt="Cober360" width="64" height="64">

    <h1>Iniciar Sesión</h1>

    <p class="notice">
      <svg width="14" height="14" aria-hidden="true"><use href="#i-alert"/></svg>
      <span>
        <b>Email o contraseña incorrectos.</b>
        Te quedan 3 intentos antes de que la cuenta se bloquee por 15 minutos.
      </span>
    </p>

    <form>
      <label class="lbl">
        <span>Email</span>
        <input class="inp" type="email" autocomplete="username" placeholder="m@example.com" value="mfernandez@cober.com.ar" aria-invalid="true">
      </label>

      <label class="lbl">
        <span class="lbl-row">
          Contraseña
          <a href="#">¿Olvidaste tu contraseña?</a>
        </span>
        <input class="inp" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" aria-invalid="true" aria-describedby="err-pass">
        <span class="err" id="err-pass">No coincide con el email ingresado.</span>
      </label>

      <button class="btn btn-primary gate-submit" type="submit">Iniciar Sesión</button>
    </form>

    <p class="alt">¿No tienes una cuenta? <a href="#">Crear Cuenta</a></p>
  </div>
</main>

<a class="ribbon" href="index.html">← Índice del set</a>
<script src="assets/app.js"></script>
</body>
</html>
